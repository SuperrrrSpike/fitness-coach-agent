<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitCoach Agent - 注册 / 登录</title>

  <!-- Tailwind CDN（国内可访问） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <!-- Supabase JS SDK（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .card-shadow {
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }
    .tab-active {
      color: #4f46e5;
      border-bottom: 2px solid #4f46e5;
    }
    .input-focus:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
    }
    .toast {
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl card-shadow p-8">

    <!-- Logo + 标题 -->
    <div class="text-center mb-6">
      <div class="inline-block p-3 bg-indigo-100 rounded-full mb-3">
        <i class="fa fa-heartbeat text-indigo-600 text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">FitCoach Agent</h1>
      <p class="text-gray-500 text-sm mt-1">你的 AI 私人健身教练</p>
    </div>

    <!-- Tab 切换：密码登录 / 魔法链接 / 注册 -->
    <div class="flex border-b border-gray-200 mb-6">
      <button class="tab-btn flex-1 py-3 text-sm font-medium tab-active" data-tab="password">
        <i class="fa fa-lock mr-1"></i> 密码登录
      </button>
      <button class="tab-btn flex-1 py-3 text-sm font-medium text-gray-500 hover:text-gray-700" data-tab="magic">
        <i class="fa fa-magic mr-1"></i> 魔法链接
      </button>
      <button class="tab-btn flex-1 py-3 text-sm font-medium text-gray-500 hover:text-gray-700" data-tab="signup">
        <i class="fa fa-user-plus mr-1"></i> 注册
      </button>
    </div>

    <!-- ============ 密码登录 ============ -->
    <form id="form-password" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
        <input type="email" id="pw-email" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus transition"
          placeholder="you@example.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
        <input type="password" id="pw-password" required minlength="6"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus transition"
          placeholder="至少 6 位" />
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 text-white py-2.5 rounded-lg hover:bg-indigo-700 transition font-medium">
        <i class="fa fa-sign-in mr-1"></i> 登录
      </button>
    </form>

    <!-- ============ 魔法链接 ============ -->
    <form id="form-magic" class="space-y-4 hidden">
      <p class="text-sm text-gray-500 mb-3">
        <i class="fa fa-info-circle text-indigo-500"></i>
        输入邮箱，我们会发送一次性登录链接（需先在 Supabase 配置邮件模板）
      </p>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
        <input type="email" id="magic-email" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus transition"
          placeholder="you@example.com" />
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 text-white py-2.5 rounded-lg hover:bg-indigo-700 transition font-medium">
        <i class="fa fa-paper-plane mr-1"></i> 发送登录链接
      </button>
    </form>

    <!-- ============ 注册 ============ -->
    <form id="form-signup" class="space-y-4 hidden">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">昵称（可选）</label>
        <input type="text" id="su-name"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus transition"
          placeholder="昵称" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
        <input type="email" id="su-email" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus transition"
          placeholder="you@example.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
        <input type="password" id="su-password" required minlength="6"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus transition"
          placeholder="至少 6 位，建议字母 + 数字组合" />
      </div>
      <button type="submit"
        class="w-full bg-green-600 text-white py-2.5 rounded-lg hover:bg-green-700 transition font-medium">
        <i class="fa fa-user-plus mr-1"></i> 创建账号
      </button>
      <p class="text-xs text-gray-500 text-center">
        注册即表示同意 <a href="#" class="text-indigo-600">用户协议</a> 和
        <a href="#" class="text-indigo-600">隐私政策</a>
      </p>
    </form>

    <!-- 状态提示区 -->
    <div id="status" class="hidden mt-4 p-3 rounded-lg text-sm"></div>

    <!-- 配置提示 -->
    <div id="config-hint" class="mt-6 p-3 bg-yellow-50 border border-yellow-200 rounded-lg text-xs text-yellow-800">
      <i class="fa fa-exclamation-triangle"></i>
      首次使用请先在 <code class="bg-yellow-100 px-1 rounded">web/js/supabase-config.js</code> 中填入
      Supabase Project URL 和 anon key。
    </div>
  </div>

  <!-- Toast 容器 -->
  <div id="toast" class="fixed top-5 right-5 z-50"></div>

  <script src="./js/supabase-config.js"></script>
  <script>
    // ============================================================
    // 工具：Toast 提示
    // ============================================================
    function toast(msg, type = 'info') {
      const colors = {
        success: 'bg-green-500',
        error: 'bg-red-500',
        info: 'bg-blue-500'
      };
      const icons = {
        success: 'fa-check-circle',
        error: 'fa-times-circle',
        info: 'fa-info-circle'
      };
      const t = document.getElementById('toast');
      t.innerHTML = `
        <div class="toast ${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-center">
          <i class="fa ${icons[type]} mr-2"></i>
          <span>${msg}</span>
        </div>
      `;
      setTimeout(() => { t.innerHTML = ''; }, 3000);
    }

    function setStatus(el, msg, type) {
      const cls = {
        success: 'bg-green-50 text-green-800 border border-green-200',
        error: 'bg-red-50 text-red-800 border border-red-200',
        info: 'bg-blue-50 text-blue-800 border border-blue-200'
      };
      el.className = `mt-4 p-3 rounded-lg text-sm ${cls[type]}`;
      el.innerHTML = msg;
      el.classList.remove('hidden');
    }

    // ============================================================
    // Tab 切换
    // ============================================================
    const tabs = document.querySelectorAll('.tab-btn');
    const forms = {
      password: document.getElementById('form-password'),
      magic: document.getElementById('form-magic'),
      signup: document.getElementById('form-signup')
    };

    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        tabs.forEach(b => b.classList.remove('tab-active'));
        btn.classList.add('tab-active');
        Object.values(forms).forEach(f => f.classList.add('hidden'));
        forms[btn.dataset.tab].classList.remove('hidden');
        document.getElementById('status').classList.add('hidden');
      });
    });

    // ============================================================
    // 检查是否已登录 → 跳转
    // ============================================================
    async function checkSession() {
      try {
        if (!isSupabaseConfigured()) return;
        const supabase = getSupabase();
        const { data } = await supabase.auth.getSession();
        if (data.session) {
          window.location.href = './dashboard.html';
        }
      } catch (e) {
        console.warn('Session check failed:', e);
      }
    }
    checkSession();

    // ============================================================
    // 1. 密码登录
    // ============================================================
    document.getElementById('form-password').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('status');
      const email = document.getElementById('pw-email').value.trim();
      const password = document.getElementById('pw-password').value;

      try {
        const supabase = getSupabase();
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) throw error;

        setStatus(statusEl, '<i class="fa fa-check-circle"></i> 登录成功，正在跳转...', 'success');
        setTimeout(() => window.location.href = './dashboard.html', 800);
      } catch (err) {
        setStatus(statusEl, '<i class="fa fa-times-circle"></i> ' + (err.message || '登录失败'), 'error');
        toast(err.message || '登录失败', 'error');
      }
    });

    // ============================================================
    // 2. 魔法链接登录
    // ============================================================
    document.getElementById('form-magic').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('status');
      const email = document.getElementById('magic-email').value.trim();

      try {
        const supabase = getSupabase();
        const { error } = await supabase.auth.signInWithOtp({
          email,
          options: {
            emailRedirectTo: window.location.origin + '/web/dashboard.html'
          }
        });
        if (error) throw error;

        setStatus(statusEl,
          '<i class="fa fa-envelope"></i> 登录链接已发送到你的邮箱，请查收',
          'success');
        toast('邮件已发送', 'success');
      } catch (err) {
        setStatus(statusEl, '<i class="fa fa-times-circle"></i> ' + (err.message || '发送失败'), 'error');
        toast(err.message || '发送失败', 'error');
      }
    });

    // ============================================================
    // 3. 注册
    // ============================================================
    document.getElementById('form-signup').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('status');
      const email = document.getElementById('su-email').value.trim();
      const password = document.getElementById('su-password').value;
      const displayName = document.getElementById('su-name').value.trim();

      try {
        const supabase = getSupabase();
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: { display_name: displayName || email.split('@')[0] },
            emailRedirectTo: window.location.origin + '/web/dashboard.html'
          }
        });

        if (error) throw error;

        // 检查是否需要邮箱验证
        if (data.session) {
          setStatus(statusEl, '<i class="fa fa-check-circle"></i> 注册成功，正在跳转...', 'success');
          setTimeout(() => window.location.href = './dashboard.html', 800);
        } else {
          setStatus(statusEl,
            '<i class="fa fa-envelope"></i> 注册成功！请前往邮箱完成验证后再登录',
            'info');
          toast('请查收验证邮件', 'info');
        }
      } catch (err) {
        setStatus(statusEl, '<i class="fa fa-times-circle"></i> ' + (err.message || '注册失败'), 'error');
        toast(err.message || '注册失败', 'error');
      }
    });

    // 隐藏配置提示（已配置时）
    if (isSupabaseConfigured()) {
      document.getElementById('config-hint').classList.add('hidden');
    }
  </script>
</body>
</html>
